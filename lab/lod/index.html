<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOD Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      .lod-panel {
        position: fixed; top: 12px; left: 12px; width: 360px; max-height: calc(100% - 24px); overflow: auto;
        padding: 10px 12px; background: rgba(8, 10, 16, 0.86); border: 1px solid #2a3040; border-radius: 6px;
        color: #cfd6e4; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .lod-panel label { display: flex; align-items: center; gap: 4px; }
      .lod-panel input[type="range"] { flex: 1; }
      .lod-title { font-weight: 700; letter-spacing: 0.12em; color: #fff; margin-bottom: 6px; }
      .lod-help { margin: 6px 0; color: #8892a6; }
      .lod-panel pre { margin: 6px 0 0; white-space: pre-wrap; color: #e6ecf6; }
      kbd { padding: 0 4px; border: 1px solid #3a4256; border-radius: 3px; color: #9fb0d0; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
