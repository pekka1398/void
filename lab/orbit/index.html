<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Lab</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #03040a; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .marker {
        position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px;
        margin: -4px 0 0 -4px; pointer-events: auto; cursor: pointer; white-space: nowrap;
        font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c9d3e6;
      }
      .marker i { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 0 1px #0008; }
      .marker.star span { color: #ffe7b0; }
      .marker.vessel i { border-radius: 0; transform: rotate(45deg); }
      .marker.vessel span { color: #7dffb0; }
      .marker.crashed span { color: #ff7a7a; }
      .marker.crowded span { display: none; }
      .panel {
        position: fixed; top: 12px; left: 12px; width: 330px; max-height: calc(100% - 24px); overflow: auto;
        padding: 10px 12px; background: rgba(8, 10, 16, 0.88); border: 1px solid #2a3040; border-radius: 6px;
        color: #cfd6e4; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .panel.right { left: auto; right: 12px; width: 300px; }
      .panel .title { font-weight: 700; letter-spacing: 0.12em; color: #fff; margin-bottom: 4px; }
      .panel .title small { font-weight: 400; letter-spacing: 0; color: #8892a6; }
      .panel label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 3px 0; }
      .panel label.indent { padding-left: 14px; }
      .panel select, .panel button {
        background: #141925; color: #dfe6f3; border: 1px solid #333c52; border-radius: 3px; font: inherit;
      }
      .panel select { max-width: 200px; }
      .panel select.invalid { border-color: #ff6a6a; }
      .panel button { width: 100%; margin: 6px 0 2px; padding: 3px; cursor: pointer; }
      .panel pre { margin: 6px 0; white-space: pre-wrap; color: #e6ecf6; }
      .panel pre.status { color: #fff; }
      .panel .help { color: #8892a6; margin-top: 6px; }
      .panel .section { margin: 10px 0 4px; color: #8892a6; letter-spacing: 0.12em; border-top: 1px solid #2a3040; padding-top: 6px; }
      .panel .throttle { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
      .panel .throttle .bar { flex: 1; height: 8px; background: #141925; border: 1px solid #333c52; border-radius: 2px; overflow: hidden; }
      .panel .throttle b { display: block; height: 100%; width: 0; background: #8a7a6a; }
      .panel .throttle b.burning { background: #ff9a3c; }
      .panel .throttle span { width: 36px; text-align: right; }
      .panel .attitude { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin: 4px 0; }
      .panel .attitude button { margin: 0; padding: 2px 0; }
      .panel .attitude button.active { background: #2b4a6b; border-color: #4fc8ff; color: #fff; }
      .marker.event i { width: 6px; height: 6px; }
      .marker.event span { color: #9fdcff; }
      .marker.impact i { background: #ff5a5a !important; }
      .marker.impact span { color: #ff8a8a; }
      kbd { padding: 0 4px; border: 1px solid #3a4256; border-radius: 3px; color: #9fb0d0; font-size: 11px; }
      .panic {
        position: fixed; inset: 12px; z-index: 9999; overflow: auto; margin: 0; padding: 20px;
        background: #260d14; color: #ffe0e5; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
